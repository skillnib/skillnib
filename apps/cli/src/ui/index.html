<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="nib-token" content="__TOKEN__">
<title>SkillNib</title>
<script src="theme.js"></script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="taskbar" id="taskbar" hidden role="progressbar" aria-label="Background task running"><i></i></div>
<header class="top">
  <button class="ibtn" id="navT" aria-label="Collapse navigation (Ctrl+B)" title="Collapse navigation (Ctrl+B)"></button>
  <span class="brand">SkillNib <span class="muted">local</span></span>
  <span class="chip" id="project" title="Project directory"></span>
  <span class="sp"></span>
  <span class="chip" id="idx" hidden role="status"><span class="dot run"></span> Updating embedding index…</span>
  <button class="chip" id="tray" aria-haspopup="true">Tasks: 0 running</button>
  <button class="ibtn" id="themeT" aria-label="Toggle theme"></button>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="back" id="back" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetT"></aside>
<div class="pop" id="pop" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js" type="module"></script>
</body>
</html>
