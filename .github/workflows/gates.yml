name: Gates
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  gates:
    # Runs on the repository's self-hosted runner. A self-hosted runner executes whatever a pull request contains,
    # so pull requests from forks are skipped; only branches of this repository run the gates.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check (spec structure, package boundaries)
        run: npm run check
      - name: Test
        run: npm test
      - name: Spec gate (approval, link, requirement coverage, scope, PR checklist)
        env:
          BASE: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE...HEAD")
          if [ -z "$(echo "$changed" | grep -v '^docs/' || true)" ]; then
            echo "Docs-only change: spec structure checked above; no build gate."; exit 0
          fi
          spec=$(printf '%s\n' "$PR_BODY" | sed -n 's/^Spec: *\(docs\/specs\/[a-z0-9-]*\.md\) *$/\1/p' | head -n1)
          [ -n "$spec" ] || { echo "GATE FAILED: PR body needs a line 'Spec: docs/specs/<id>.md'"; exit 1; }
          [ -f "$spec" ] || { echo "GATE FAILED: $spec does not exist"; exit 1; }
          if printf '%s\n' "$PR_BODY" | grep -q '^- \[ \]'; then
            echo "GATE FAILED: unticked items in the PR checklist"; exit 1
          fi
          node tools/gates/speclink.mjs verify "$spec" --base "$BASE"
